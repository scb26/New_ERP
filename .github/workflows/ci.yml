name: Unidex ERP - Continuous Integration & Quality Gates

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck (tsc)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Type Checking
        run: npm run lint

  build:
    name: Production Client Build (Vite)
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Vite Production Build
        run: npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unidex-dist-build
          path: dist/
          retention-days: 7

  db-integrity-smoke:
    name: Database Engine & ACID Smoke Test
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify SQLite WAL & Integrity Checks
        run: |
          node --input-type=module -e '
            import { DatabaseSync } from "node:sqlite";
            const db = new DatabaseSync(":memory:");
            db.exec("PRAGMA journal_mode = WAL;");
            db.exec("CREATE TABLE health_check (id INTEGER PRIMARY KEY, status TEXT);");
            db.exec("INSERT INTO health_check (status) VALUES (\"PASS\");");
            const check = db.prepare("PRAGMA integrity_check;").get();
            if (check.integrity_check !== "ok") {
              console.error("Integrity check failed:", check);
              process.exit(1);
            }
            console.log("Database engine smoke test passed with integrity: ok");
          '

  release-package:
    name: Package Portable Release Bundle
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, db-integrity-smoke]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: unidex-dist-build
          path: dist

      - name: Create Release Archive
        run: |
          zip -r unidex-erp-release-${{ github.ref_name }}.zip dist/ START_UNIDEX_ERP.bat package.json server.ts README.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: unidex-erp-release-${{ github.ref_name }}.zip
          generate_release_notes: true
